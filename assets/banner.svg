<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>

    <style>
      .orbit-line {
        animation: spin 25s linear infinite;
        transform-origin: 1000px 170px;
      }
      .pulse-dot {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: wave 8s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scan 4s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.4; }
        100% { r: 9px; opacity: 1; }
      }
      @keyframes wave {
        0% { transform: translateY(0px); }
        100% { transform: translateY(15px); }
      }
      @keyframes scan {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(300px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="340" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Graphic Elements (Pills / Nodes / Orbits in Background) -->
  <g opacity="0.4">
    <!-- Orbital path 1 -->
    <circle cx="1000" cy="170" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="1000" cy="170" r="220" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8"/>
    
    <!-- Rotating satellite node in background -->
    <g class="orbit-line">
      <circle cx="1140" cy="170" r="6" fill="#38bdf8"/>
      <line x1="1000" y1="170" x2="1140" y2="170" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
    </g>

    <!-- Topography / Elevation curves in background right -->
    <path class="wave-line" d="M 700 280 Q 850 200 1000 260 T 1200 220" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.5"/>
    <path class="wave-line" d="M 650 310 Q 800 240 980 300 T 1200 260" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

    <!-- Dynamic Pulsing Nodes -->
    <circle cx="850" cy="90" fill="#38bdf8" class="pulse-dot"/>
    <circle cx="980" cy="120" fill="#818cf8" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="1100" cy="240" fill="#c084fc" class="pulse-dot" style="animation-delay: 2s;"/>
    <circle cx="750" cy="220" fill="#34d399" class="pulse-dot" style="animation-delay: 1.5s;"/>

    <!-- Connecting lines -->
    <polyline points="850,90 980,120 1100,240" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polyline points="750,220 980,120" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Globe Outline on Right (Background accent) -->
  <g transform="translate(900, 160)" opacity="0.25">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="40" fill="none" stroke="#f8fafc" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="40" ry="110" fill="none" stroke="#f8fafc" stroke-width="1"/>
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#f8fafc" stroke-width="1"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#f8fafc" stroke-width="1"/>
  </g>

  <!-- Radar / Scanning effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="2" class="scan-line" opacity="0.3"/>

  <!-- Foreground Content Container (Guaranteed Clear & Readable Text) -->
  <!-- Header Badges / Tagline Pill -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="15" r="5" fill="#34d399"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">EARTH OBSERVATION &amp; GIS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Geospatial Intelligence
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Curated SaaS Platforms, Earth Observation Tools &amp; Open-Source Geospatial Stack
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(60, 205)">
    <!-- Pill 1: Satellite AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">🛰️ Satellite AI &amp; EO</text>
    </g>

    <!-- Pill 2: Spatial Data Warehouses -->
    <g transform="translate(172, 0)">
      <rect x="0" y="0" width="185" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">🗺️ Spatial Analytics</text>
    </g>

    <!-- Pill 3: Open Source Stack -->
    <g transform="translate(369, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">🌐 Open-Source GIS</text>
    </g>
  </g>

  <!-- Footer Info Line -->
  <g transform="translate(60, 280)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
      Updated for 2026 • Verified Pricing, Free Tiers &amp; GitHub Star Counts
    </text>
  </g>
</svg>
